html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {

  color: rgba(128, 255, 128, 0.8);
  text-shadow: 0 0 1ex #33ff33, 0 0 2px rgba(255, 255, 255, 0.8);
  overflow: hidden;
}

.noise {
  pointer-events: none;
  position: fixed;
  width: 100%;
  height: 100%;
  background-image: url("https://media.giphy.com/media/oEI9uBYSzLpBK/giphy.gif");
  background-repeat: no-repeat;
  background-size: cover;
  z-index: -1;
  opacity: 0.02;
}

.overlay {
  pointer-events: none;
  position: fixed;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(180deg, rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0) 100%);
  background-size: auto 4px;
  z-index: 1;
}

.overlay::before {
  content: "";
  pointer-events: none;
  position: absolute;
  display: block;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 100%;
  background-image: linear-gradient(0deg, transparent 0%, rgba(32, 128, 32, 0.2) 2%, rgba(32, 128, 32, 0.8) 3%, rgba(32, 128, 32, 0.2) 3%, transparent 100%);
  background-repeat: no-repeat;
  animation: scan 7.5s linear 0s infinite;
}

@keyframes scan {
  0% { background-position: 0 -100vh; }
  35%, 100% { background-position: 0 100vh; }
}

/* SAĞ ÜST DİL BUTONLARI */
.lang-switch {

  right: 25px;

  display: flex;

}

.lang-btn {

  color: #33ff33;
  padding: 6px 14px;
  font-family: "Inconsolata", monospace;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  border-radius: 4px;
  text-shadow: 0 0 1ex #33ff33;
  transition: all 0.2s ease;
}

.lang-btn.active, .lang-btn:hover {
  background: #33ff33;
  color: #000000;
  box-shadow: 0 0 10px #33ff33;
  text-shadow: none;
}

/* TERMINAL & SCROLLBAR */
.terminal {
  box-sizing: border-box;
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  width: 100%;
  padding: 4rem;
  text-transform: uppercase;
  overflow-y: auto;
}

.terminal > * {
  max-width: 1050px;
}

.terminal::-webkit-scrollbar {
  width: 10px;
}

.terminal::-webkit-scrollbar-track {
  background: rgba(4, 22, 7, 0.6);
}

.terminal::-webkit-scrollbar-thumb {
  background: #33ff33;
  border-radius: 2px;
  box-shadow: 0 0 5px #33ff33;
}

.terminal::-webkit-scrollbar-thumb:hover {
  background: #11581E;
}

.output {
  color: rgba(128, 255, 128, 0.8);
  text-shadow: 0 0 1px rgba(51, 255, 51, 0.4), 0 0 2px rgba(255, 255, 255, 0.8);
}

.output::before {
  content: "> ";
}

a {
  color: #fff;
  text-decoration: none;
}

a::before { content: "["; }
a::after { content: "]"; }

.errorcode { color: white; }

#input-line {
  display: flex;
  margin-top: 20px;
}

#prompt {
  color: rgba(192, 255, 192, 0.8);
  text-shadow: 0 0 1px rgba(51, 255, 51, 0.4), 0 0 2px rgba(255, 255, 255, 0.8);
}

#input {
  flex: 1;
  background: transparent;
  border: none;
  color: rgba(192, 255, 192, 0.8);
  font-family: inherit;
  font-size: inherit;
  text-shadow: 0 0 1px rgba(51, 255, 51, 0.4), 0 0 2px rgba(255, 255, 255, 0.8);
  text-transform: uppercase;
  outline: none;
  margin-left: 5px;
}

.ascii-art {
  white-space: pre;
  font-family: monospace;
  font-size: 0.75em;
  line-height: 1.3;
  color: #33ff33;
}
</style>

function setLanguage(lang) {
    currentLang = lang;
    
    // Buton görünümlerini güncelle
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.getElementById('btn-tr').classList.toggle('active', lang === 'tr');
    
    // Arayüz sabit yazılarını güncelle
    subtitleText.innerHTML = translations[lang].subtitle;
    helpText.innerHTML = translations[lang].helpBanner;
}

function addOutput(text) {
    const p = document.createElement('p');
    p.classList.add('output');
    p.innerHTML = text;
    terminalOutput.appendChild(p);
    terminal.scrollTop = terminal.scrollHeight;
}

let lastResponseIndex = -1;
function getRandomFunnyResponse() {
    const list = translations[currentLang].funny;
    let newIndex;
    do {
        newIndex = Math.floor(Math.random() * list.length);
    } while (newIndex === lastResponseIndex && list.length > 1);
    
    lastResponseIndex = newIndex;
    return list[newIndex];
}

async function typeWriter(text, element, speed = 2) {
    for (let i = 0; i < text.length; i++) {
        element.innerHTML += text.charAt(i);
        await new Promise(resolve => setTimeout(resolve, speed));
        terminal.scrollTop = terminal.scrollHeight;
    }
}

function normalizeCommand(cmd) {
    if (!cmd) return '';
    return cmd.trim()
        .replace(/İ/g, 'i')
        .replace(/I/g, 'i')
        .replace(/ı/g, 'i')
        .replace(/Ğ/g, 'g').replace(/ğ/g, 'g')
        .replace(/Ü/g, 'u').replace(/ü/g, 'u')
        .replace(/Ş/g, 's').replace(/ş/g, 's')
        .replace(/Ö/g, 'o').replace(/ö/g, 'o')
        .replace(/Ç/g, 'c').replace(/ç/g, 'c')
        .toLowerCase();
}

function processCommand(command) {
    const cleanCommand = normalizeCommand(command);

    if (cleanCommand !== '' && cleanCommand !== 'clear' && cleanCommand !== 'temizle') {
        gtag('event', 'terminal_command', {
            'command_value': cleanCommand
        });
    }

    const t = translations[currentLang];

    // TR VE ENG DİLİNDEKİ TÜM KOMUT EŞLEŞTİRMELERİ
    let action = '';
    if (['help', 'yardim'].includes(cleanCommand)) action = 'help';
    else if (['about', 'hakkimda', 'hakkinda'].includes(cleanCommand)) action = 'about';
    else if (['education', 'egitim'].includes(cleanCommand)) action = 'education';
    else if (['skills', 'yetenekler'].includes(cleanCommand)) action = 'skills';
    else if (['experience', 'deneyim', 'tecrube'].includes(cleanCommand)) action = 'experience';
    else if (['dashboard', 'pano'].includes(cleanCommand)) action = 'dashboard';
    else if (['certifications', 'sertifikalar'].includes(cleanCommand)) action = 'certifications';
    else if (['contact', 'iletisim'].includes(cleanCommand)) action = 'contact';
    else if (['cv', 'ozgecmis'].includes(cleanCommand)) action = 'cv';
    else if (['clear', 'temizle'].includes(cleanCommand)) action = 'clear';

    switch(action) {
        case 'help':
            return t.help;
        case 'about':
            return t.about;
        case 'education':
            return t.education;
        case 'skills':
            return t.skills;
        case 'experience':
            return t.experience;
        case 'dashboard':
            displayBusinessDashboard();
            return '';
        case 'certifications':
            return t.certifications;
        case 'contact':
            return t.contact;
        case 'cv':
            const link = document.createElement('a');
            link.href = 'Baris_Umut_Altun_CV.pdf';
            link.download = 'Baris_Umut_Altun_CV.pdf';
            link.click();
            return t.cv;
        case 'clear':
            terminalOutput.innerHTML = '';
            return '';
        default:
            return getRandomFunnyResponse();
    }
}

input.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        const command = this.value;
        addOutput(`$ ${command}`);
        
        const output = processCommand(command);
        if (output) addOutput(output);

        this.value = '';
    }
});

input.focus();

terminal.addEventListener('click', function() {
    input.focus();
});
</script>
