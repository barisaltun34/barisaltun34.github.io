function setLanguage(lang) {

function addOutput(text) {
    const p = document.createElement('p');
    p.classList.add('output');
    p.innerHTML = text;
    terminalOutput.appendChild(p);
    terminal.scrollTop = terminal.scrollHeight;
}

async function typeWriter(text, element, speed = 2) {
    for (let i = 0; i < text.length; i++) {
        element.innerHTML += text.charAt(i);
        await new Promise(resolve => setTimeout(resolve, speed));
        terminal.scrollTop = terminal.scrollHeight;
    }
}

    const consoleElement = document.createElement('div');

    terminalOutput.appendChild(consoleElement);

    await typeWriter(dashboardContent, consoleElement, 2);

    await new Promise(resolve => setTimeout(resolve, 300));
    const finalMessage = document.createElement('p');
    finalMessage.classList.add('output');
    terminalOutput.appendChild(finalMessage);
    await typeWriter(isTr ? "Operasyonel özet başarıyla oluşturuldu. Sistem kararlı." : "Operational overview generated successfully. System stable.", finalMessage, 15);
}

}

function normalizeCommand(cmd) {
    if (!cmd) return '';
    return cmd.trim()
        .replace(/İ/g, 'i')
        .replace(/I/g, 'i')
        .replace(/ı/g, 'i')
        .replace(/Ğ/g, 'g').replace(/ğ/g, 'g')
        .replace(/Ü/g, 'u').replace(/ü/g, 'u')
        .replace(/Ş/g, 's').replace(/ş/g, 's')
        .replace(/Ö/g, 'o').replace(/ö/g, 'o')
        .replace(/Ç/g, 'c').replace(/ç/g, 'c')
        .toLowerCase();
}

function processCommandInternal(command, forcedFunnyIndex = -1) {
    const cleanCommand = normalizeCommand(command);
    const t = translations[currentLang];

    let action = '';
    if (['help', 'yardim'].includes(cleanCommand)) action = 'help';
    else if (['about', 'hakkimda', 'hakkinda'].includes(cleanCommand)) action = 'about';
    else if (['education', 'egitim'].includes(cleanCommand)) action = 'education';
    else if (['skills', 'yetenekler'].includes(cleanCommand)) action = 'skills';
    else if (['experience', 'deneyim', 'tecrube'].includes(cleanCommand)) action = 'experience';
    else if (['dashboard', 'pano'].includes(cleanCommand)) action = 'dashboard';
    else if (['certifications', 'sertifikalar'].includes(cleanCommand)) action = 'certifications';
    else if (['contact', 'iletisim'].includes(cleanCommand)) action = 'contact';
    else if (['cv', 'ozgecmis'].includes(cleanCommand)) action = 'cv';
    else if (['clear', 'temizle'].includes(cleanCommand)) action = 'clear';

    if (action === 'clear') {
        return { action: 'clear', text: '' };
    }

    if (action === 'dashboard') {
        return { action: 'dashboard', text: '' };
    }

    if (action && t[action]) {
        return { action: action, text: t[action] };
    }

    // Geçersiz komut durumu
    let funnyIdx = forcedFunnyIndex;
    if (funnyIdx === -1 || funnyIdx >= t.funny.length) {
        funnyIdx = Math.floor(Math.random() * t.funny.length);
    }
    return { action: 'funny', text: t.funny[funnyIdx], funnyIndex: funnyIdx };
}

function reRenderHistory() {
    terminalOutput.innerHTML = '';
    for (const item of historyLog) {
        // Komut satırını yaz
        const promptLine = document.createElement('p');
        promptLine.classList.add('output');
        promptLine.innerHTML = `$ ${item.command}`;
        terminalOutput.appendChild(promptLine);

        // Çıktıyı mevcut dilde hesapla ve ekle
        const res = processCommandInternal(item.command, item.funnyIndex);
        if (res.action === 'dashboard') {
            renderDashboardSync();
        } else if (res.text) {
            const p = document.createElement('p');
            p.classList.add('output');
            p.innerHTML = res.text;
            terminalOutput.appendChild(p);
        }
    }
    terminal.scrollTop = terminal.scrollHeight;
}

input.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        const command = this.value;
        if (!command.trim()) return;

        const cleanCmd = normalizeCommand(command);

        if (cleanCmd !== 'clear' && cleanCmd !== 'temizle') {
            gtag('event', 'terminal_command', { 'command_value': cleanCmd });
        }

        const res = processCommandInternal(command);

        if (res.action === 'clear') {
            historyLog = [];
            terminalOutput.innerHTML = '';
        } else {
            historyLog.push({ command: command, funnyIndex: res.funnyIndex !== undefined ? res.funnyIndex : -1 });
            
            addOutput(`$ ${command}`);

            if (res.action === 'dashboard') {
                displayBusinessDashboardAnimated();
            } else if (res.text) {
                if (res.action === 'cv') {
                    const link = document.createElement('a');
                    link.href = 'Baris_Umut_Altun_CV.pdf';
                    link.download = 'Baris_Umut_Altun_CV.pdf';
                    link.click();
                }
                addOutput(res.text);
            }
        }

        this.value = '';
    }
});

input.focus();

});
